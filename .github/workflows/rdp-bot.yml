name: LBank Bot

on:
  workflow_dispatch:
  schedule:
    # هر ۵ ساعت تا قبل از تمام شدن timeout ۶ ساعته دوباره بالا بیاید
    - cron: "0 */5 * * *"
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
     contents: write
    steps:
      - name: Checkout bot code
        uses: actions/checkout@v4
      - name: Check agents package
        run: |
          python -c "from agents.pipeline import run_pipeline_symbol; print('agents OK')"
          Select-String -Path bot.py -Pattern "BOT_VERSION|run_filter|TRADE_MODE"
      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: |
            bot_state.json
            bot_state.bak
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            pip install numpy pandas requests websockets matplotlib
          }
      - name: Run bot until job timeout (~6h)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TRADE_MODE: ${{ secrets.TRADE_MODE }}
        
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host "Starting bot from: $(Get-Location)"
          if (Test-Path bot.py) {
            Select-String -Path "bot.py" -Pattern "BOT_VERSION" | ForEach-Object { $_.Line }
          } else {
            Write-Host "ERROR: bot.py not found"
            Get-ChildItem
            exit 1
          }
          $tok = $env:TELEGRAM_TOKEN
          $cid = $env:CHAT_ID
          if (-not $tok -or $tok.Length -lt 20) {
            Write-Host "ERROR: TELEGRAM_TOKEN secret missing or short"
            exit 1
          }
          if (-not $cid) {
            Write-Host "ERROR: CHAT_ID secret missing"
            exit 1
          }
          Write-Host "Token length OK, Chat ID present"
          Write-Host "AUTO_TRADE=$env:AUTO_TRADE DRY_RUN=$env:AUTO_TRADE_DRY_RUN"
          if (Test-Path bot_state.json) { Write-Host "state: present" } else { Write-Host "state: none yet" }
          python -u bot.py

      - name: Keep state files for cache save
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path bot_state.json)) { "{}" | Out-File -Encoding utf8 bot_state.json }
          if (Test-Path bot_state.json) { Copy-Item bot_state.json bot_state.bak -Force }
          Write-Host "state bytes:" (Get-Item bot_state.json).Length

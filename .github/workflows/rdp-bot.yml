name: LBank Bot

on:
  workflow_dispatch:
  # اختیاری: هر ۵ ساعت یک‌بار دوباره استارت (بعد از قطع شدن)
  # schedule:
  #   - cron: "0 */5 * * *"

jobs:
  bot:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore bot state
        uses: actions/cache@v5
        with:
          path: bot_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          Write-Host "Starting bot..."
          Select-String -Path "bot.py" -Pattern "BOT_VERSION" | ForEach-Object { $_.Line }
          python -u bot.py

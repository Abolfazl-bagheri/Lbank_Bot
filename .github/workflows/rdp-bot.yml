name: LBank Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: bot_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        shell: pwsh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          if (-not $env:TELEGRAM_TOKEN) { Write-Error "TELEGRAM_TOKEN secret missing"; exit 1 }
          if (-not $env:CHAT_ID) { Write-Error "CHAT_ID secret missing"; exit 1 }
          python -u bot.py

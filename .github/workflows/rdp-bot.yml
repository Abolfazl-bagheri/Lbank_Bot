name: Windows RDP + LBank Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout bot code
        uses: actions/checkout@v4

      - name: Restore bot state (from previous runs)
        uses: actions/cache@v4
        with:
          path: bot_state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

      - name: Create Admin Account
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $pass = $env:RDP_PASSWORD
          if (-not $pass) { $pass = "CHANGE_ME_NOW" }
          $Password = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin $pass

      - name: Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-bot"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "RDP IP: $ts_ip"
          Write-Host "User: NvDAdmin"

      - name: Start Telegram bot (background)
        shell: pwsh
        run: |
          $dir = $env:GITHUB_WORKSPACE
          Set-Location $dir
          Write-Host "Files:" (Get-ChildItem | Select-Object -ExpandProperty Name)
          Select-String -Path "bot.py" -Pattern "BOT_VERSION" | ForEach-Object { $_.Line }
          Start-Process -FilePath "python" `
            -ArgumentList "-u", "bot.py" `
            -WorkingDirectory $dir `
            -RedirectStandardOutput "$dir\bot_out.log" `
            -RedirectStandardError "$dir\bot_err.log" `
            -WindowStyle Hidden
          Start-Sleep -Seconds 8
          Write-Host "=== bot_out.log ==="
          if (Test-Path bot_out.log) { Get-Content bot_out.log -Tail 30 } else { Write-Host "no out log" }
          Write-Host "=== bot_err.log ==="
          if (Test-Path bot_err.log) { Get-Content bot_err.log -Tail 30 } else { Write-Host "no err log" }
          $p = Get-Process python -ErrorAction SilentlyContinue
          if ($p) { Write-Host "python running PID:" $p.Id } else { Write-Host "WARNING: python not running" }

      - name: Keep alive + save state every 30 min
        shell: pwsh
        run: |
          # ~6 hours (timeout job = 360 min)
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 30 -eq 0) {
              Write-Host "[$i] heartbeat — state file exists? $(Test-Path bot_state.json)"
            }
          }
